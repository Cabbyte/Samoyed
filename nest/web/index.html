<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samoyed Nest</title><style>
:root{font:17px -apple-system,BlinkMacSystemFont,sans-serif;color:#25323a;background:#f4f6f4}body{margin:0}main{max-width:480px;margin:8vh auto;padding:28px}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.7;color:#55636a}button,input{font:inherit;border-radius:14px;padding:14px;width:100%;box-sizing:border-box;margin:8px 0}button{border:0;background:#29634f;color:white;cursor:pointer}button.secondary{background:#e1e9e3;color:#253c32}input{border:1px solid #becbc0;background:white}section{margin:22px 0;padding:20px;background:white;border-radius:20px}code{overflow-wrap:anywhere;font-size:13px}#status{white-space:pre-wrap}li{margin:10px 0}a{color:#29634f}button:disabled{opacity:.5}[hidden]{display:none!important}</style></head>
<body><main><h1>Samoyed Nest</h1><p>日程、执行记录与时间轴 Note。</p><div id="status" role="status"></div>
<section id="login"><h2>登录</h2><button id="signin">使用 Passkey 登录</button><details><summary>首次加入内测</summary><label>邀请码<input id="invitation" autocomplete="off" spellcheck="false"></label><button id="register">创建账户与 Passkey</button></details></section>
<section id="consent" hidden><h2>授权连接</h2><p id="client"></p><ul id="scopes"></ul><button id="accept">允许访问</button><button class="secondary" id="reject">取消</button></section>
<section id="account" hidden><h2 id="name">账户</h2><p>在 Samoyed iOS 中绑定此 Nest，或连接 Samoyed Nest 插件。</p><h3>Passkey</h3><div id="keys"></div><button class="secondary" id="addkey">添加 Passkey</button><h3>设备与 Agent</h3><div id="grants"></div><button class="secondary" id="signout">退出网页登录</button></section>
<p>仅邀请码内测。账户支持多个 Passkey，暂不提供邮件找回。</p></main><script type="module" src="/assets/auth.js"></script></body></html>
