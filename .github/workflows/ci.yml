name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nest-tests:
    name: Nest SQLite and D1 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nest/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:d1
      - run: npm run build && npm run validate

  core-tests:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify brand cleanliness
        run: bash scripts/verify_brand_cleanliness.sh

      - name: Describe core package
        run: swift package describe

      - name: Run core tests
        run: swift test

  ios-archive:
    name: Unsigned iOS archive
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Record Xcode version
        run: xcodebuild -version

      - name: Archive app and embedded widget without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Samoyed.xcodeproj \
            -scheme Samoyed \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Samoyed.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/Samoyed-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Verify archive contents and privacy manifests
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Samoyed.xcarchive/Products/Applications/Samoyed.app"
          widget_path="$app_path/PlugIns/SamoyedWidgetExtension.appex"
          app_info="$app_path/Info.plist"
          widget_info="$widget_path/Info.plist"
          test -d "$app_path"
          test -d "$widget_path"
          test -f "$app_path/PrivacyInfo.xcprivacy"
          test -f "$widget_path/PrivacyInfo.xcprivacy"
          plutil -lint "$app_path/PrivacyInfo.xcprivacy"
          plutil -lint "$widget_path/PrivacyInfo.xcprivacy"

          app_settings="$(xcodebuild -project Samoyed.xcodeproj -target Samoyed -configuration Release -showBuildSettings)"
          widget_settings="$(xcodebuild -project Samoyed.xcodeproj -target SamoyedWidgetExtension -configuration Release -showBuildSettings)"
          app_bundle_id="$(awk '$1 == "PRODUCT_BUNDLE_IDENTIFIER" && $2 == "=" { print $3; exit }' <<< "$app_settings")"
          widget_bundle_id="$(awk '$1 == "PRODUCT_BUNDLE_IDENTIFIER" && $2 == "=" { print $3; exit }' <<< "$widget_settings")"
          app_group_id="$(awk '$1 == "SAMOYED_APP_GROUP_ID" && $2 == "=" { print $3; exit }' <<< "$app_settings")"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_info")" = "Samoyed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$widget_info")" = "Samoyed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info")" = "$app_bundle_id"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget_info")" = "$widget_bundle_id"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SamoyedAppGroupIdentifier' "$app_info")" = "$app_group_id"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SamoyedAppGroupIdentifier' "$widget_info")" = "$app_group_id"

          schemes="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes' "$app_info" | awk '/^[[:space:]]+[[:alnum:]]/ { print $1 }')"
          test "$(wc -l <<< "$schemes" | tr -d ' ')" -eq 1
          test "$schemes" = "samoyed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' "$app_info")" = "top.protium.samoyed"
